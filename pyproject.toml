[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocron-scheduler"
dynamic = ["version"]
description = "Automate scripts with zero setup. Run Python tasks anytime, anywhere."
readme = "README.md"
authors = [
 {name = "MD Shoaib Uddin Chanda", email = "mdshoaibuddinchanda@gmail.com"}
]
maintainers = [
 {name = "MD Shoaib Uddin Chanda", email = "mdshoaibuddinchanda@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["scheduler", "cron", "automation", "task", "periodic", "cross-platform"]
classifiers = [
 "Development Status :: 4 - Beta",
 "Intended Audience :: Developers",
 "Programming Language :: Python :: 3",
 "Programming Language :: Python :: 3.10",
 "Programming Language :: Python :: 3.11",
 "Programming Language :: Python :: 3.12",
 "Programming Language :: Python :: 3.13",
 "Programming Language :: Python :: 3.14",
 "Operating System :: OS Independent",
 "Operating System :: Microsoft :: Windows",
 "Operating System :: POSIX :: Linux",
 "Operating System :: MacOS",
 "Topic :: Software Development :: Libraries :: Python Modules",
 "Topic :: System :: Monitoring",
 "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
 "croniter>=1.4.0",
 "psutil>=5.9.0",
 "pyyaml>=6.0",
 "tzdata>=2024.1; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = [
 "pytest>=7.4.0",
 "pytest-asyncio>=0.21.0",
 "pytest-cov>=4.1.0",
 "pytest-mock>=3.11.0",
 "pytest-timeout>=2.1.0",
 "black>=24.8.0",
 "flake8>=6.1.0",
 "mypy>=1.5.0",
 "isort>=5.12.0",
 "pylint>=2.17.0",
 "build>=1.2.2",
 "twine>=5.1.1",
 "check-jsonschema>=0.31.0",
 "types-croniter>=2.0.0",
 "types-PyYAML>=6.0.0",
]
notifications = [
 "plyer>=2.1.0",
]
dashboard = [
 "rich>=13.0.0",
]
docs = [
 "mkdocs>=1.6.0",
 "mkdocs-material>=9.5.0",
 "mkdocstrings[python]>=0.27.0",
 "linkchecker>=10.5.0",
]
demo = [
 "nbclient>=0.10.0",
 "nbformat>=5.10.0",
 "ipykernel>=6.29.0",
 "nbmake>=1.5.5",
]
security = [
 "bandit[toml]>=1.7.10",
 "pip-audit>=2.7.3",
]
all = [
 "plyer>=2.1.0",
 "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/mdshoaibuddinchanda/autocron"
Documentation = "https://mdshoaibuddinchanda.github.io/autocron/"
Repository = "https://github.com/mdshoaibuddinchanda/autocron"
"Bug Tracker" = "https://github.com/mdshoaibuddinchanda/autocron/issues"
PyPI = "https://pypi.org/project/autocron-scheduler/"

[project.scripts]
autocron = "autocron.interface.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["autocron", "autocron.*"]

[tool.setuptools.dynamic]
version = {attr = "autocron.version.__version__"}

[tool.setuptools.package-data]
autocron = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
 "--strict-markers",
 "--cov=autocron",
 "--cov-report=term-missing",
 "--cov-report=html",
 "--cov-report=xml",
]
markers = [
 "slow: marks tests as slow (deselect with '-m \"not slow\"')",
 "integration: marks tests as integration tests",
 "asyncio: marks tests as async tests",
 "windows: marks tests that only run on Windows",
 "linux: marks tests that only run on Linux",
 "darwin: marks tests that only run on macOS",
 "packaging: marks isolated wheel/sdist build and installation tests",
 "system: marks tests that may modify the host OS scheduler",
]

[tool.coverage.run]
branch = true
relative_files = true
concurrency = ["thread"]
source = ["autocron"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 75
exclude_lines = [
 "pragma: no cover",
 "def __repr__",
 "raise AssertionError",
 "raise NotImplementedError",
 "if __name__ == .__main__.:",
 "if TYPE_CHECKING:",
 "class .*\\bProtocol\\):",
 "@(abc\\.)?abstractmethod",
 "pass"
]
