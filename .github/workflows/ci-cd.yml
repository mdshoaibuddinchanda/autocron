name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev,all]"
      - name: Run isolated tests and coverage
        run: pytest -q --cov-fail-under=70 --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  quality:
    name: Formatting and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tools
        run: python -m pip install -e ".[dev]"
      - name: Black
        run: black --check autocron tests examples verify_installation.py
      - name: isort
        run: isort --check-only autocron tests examples verify_installation.py
      - name: Flake8
        run: flake8 autocron tests examples --max-line-length=100 --extend-ignore=E203,W503
      - name: MyPy
        run: mypy autocron --ignore-missing-imports --allow-untyped-defs --no-warn-return-any
        # Optional platform stubs (notably fcntl on some runners) vary by
        # Python distribution; the Windows PY312 gate and local clean check
        # remain authoritative while this advisory result is reported.
        continue-on-error: true
      - name: Compile sources
        run: python -m compileall -q autocron tests examples

  package:
    name: Build and inspect wheel
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build distribution
        run: |
          python -m pip install -e ".[dev]"
          python -m build
          python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install --no-deps dist/*.whl
          .wheel-test/bin/python -c "import autocron; print(autocron.__version__)"
          .wheel-test/bin/autocron --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/

  notebooks:
    name: Execute demo notebooks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install notebook dependencies
        run: python -m pip install -e ".[demo]"
      - name: Run notebooks
        run: pytest --no-cov --nbmake demo --nbmake-timeout=120
